schemaVersion: "1"
# Templated by omp-sbxenv at launch time — do not hardcode a name/workspace
# here, since this one file is reused for every project directory.
name: ${OMP_SBXENV_NAME}
agent: omp
kits:
  - ${OMP_SBXENV_KIT_DIR}
workspace: ${OMP_SBXENV_WORKSPACE}
additionalWorkspaces:
  # ~/.omp persists agent.db, managed-skills, memories, and sessions across
  # sandbox restarts. Must exist on the host — `sbx env create` prompts
  # interactively (and hangs in non-interactive/CI contexts) if it doesn't.
  - path: ${HOME}/.omp
sandboxOptions:
  template: omp-sbx:latest
env:
  # Native Morph API key (optional). Unlike sbx-kit/spec.yaml's
  # environment.variables map, ${VAR} here expands to the real value from
  # omp-sbxenv's shell environment.
  MORPH_API_KEY: ${MORPH_API_KEY:-}
