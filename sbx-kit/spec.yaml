schemaVersion: "1"
kind: sandbox
name: omp
displayName: OMP
description: The omp coding agent (oh-my-pi) — runs inside a Docker sbx sandbox.

sandbox:
  image: "omp-sbx:latest"
  aiFilename: AGENTS.md
  entrypoint:
    run: [omp]
commands:
  startup:
    - command:
        - "bash"
        - "-c"
        - |
          # Symlink host ~/.omp mount to /home/agent/.omp
          OMP_HOST=$(find /Users -maxdepth 2 -name .omp -type d 2>/dev/null | head -1)
          [ -n "$OMP_HOST" ] && ln -sf "$OMP_HOST" "$HOME/.omp" || true
          # Symlink host ~/.config/gh mount to /home/agent/.config/gh (gh CLI session)
          GH_HOST=$(mount | grep 'type virtiofs' | grep '/.config/gh$' | sed 's/.* on //; s/ type.*//' | head -1)
          if [ -n "$GH_HOST" ] && [ "$GH_HOST" != "$HOME/.config/gh" ]; then
            mkdir -p "$HOME/.config"
            ln -sf "$GH_HOST" "$HOME/.config/gh"
          fi
          # Configure git to use gh as a credential helper (enables `git push`
          # over HTTPS by leveraging the gh OAuth token from the mounted session).
          # Only runs when the gh config is present and gh is authenticated.
          if [ -f "$HOME/.config/gh/hosts.yml" ] && gh auth status >/dev/null 2>&1; then
            gh auth setup-git 2>/dev/null || true
          fi
          # Symlink primary workspace mount to /home/agent/workspace
          # sbx mounts workspaces at their host path; we need them at the
          # template's WORKDIR (/home/agent/workspace) for omp to find them.
          WS_HOST=$(mount | grep 'type virtiofs' | grep -v '\.omp' | grep -v resolv | sed 's/.* on //; s/ type.*//' | head -1)
          if [ -n "$WS_HOST" ] && [ "$WS_HOST" != "/home/agent/workspace" ]; then
            rm -rf /home/agent/workspace
            ln -sf "$WS_HOST" /home/agent/workspace
          fi
      user: "1000"
      description: Symlink host mounts and configure gh credential helper for git push

# ── Network ──────────────────────────────────────────────────────────────────
# omp needs to reach model API providers. The sbx proxy injects API keys from
# the host secret store; inside the sandbox only a placeholder is visible.
network:
  allowedDomains:
    # Model providers — add the ones you use
    - "api.anthropic.com:443"
    - "api.openai.com:443"
    - "openrouter.ai:443"
    - "*.openrouter.ai:443"
    # omp release downloads (native addon self-extraction, updates)
    - "github.com:443"
    - "*.githubusercontent.com:443"
    - "raw.githubusercontent.com:443"
    # Package registries (npm, pip, cargo)
    - "registry.npmjs.org:443"
    - "pypi.org:443"
    - "files.pythonhosted.org:443"
    # Local model servers (host.docker.internal resolves to host)
    - "host.docker.internal:*"

# ── Environment ──────────────────────────────────────────────────────────────
# PI_CONFIG_DIR=.omp makes omp use ~/.omp (the symlink to the host mount).
environment:
  variables:
    PI_CONFIG_DIR: ".omp"
    HOME: "/home/agent"
    GH_CONFIG_DIR: "/home/agent/.config/gh"

# ── Agent context (appended to AGENTS.md) ────────────────────────────────────
agentContext: |
  ## Sandbox environment

  You are running inside a Docker sbx sandbox (microVM). The workspace is
  mounted at `/home/agent/workspace`. Your configs (`~/.omp`) are bind-mounted
  from the host — agent.db, managed-skills, memories, and sessions persist
  across sandbox restarts.
  GitHub authentication is forwarded from the host: `gh` CLI commands work
  directly, and `git push` over HTTPS uses the gh credential helper (no
  separate token or SSH setup needed). If `gh auth status` fails, the host's
  `~/.config/gh` is not mounted — recreate the sandbox with `omp-sbx --new`.

  `sudo` is passwordless; use it for system package installs.

  The omp binary self-extracts its native addons into `~/.omp/natives/` on
  first run. If natives fail to load, ensure `~/.omp/natives/` is writable
  and delete the version subdir to force re-extraction.
