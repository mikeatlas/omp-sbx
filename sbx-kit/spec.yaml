schemaVersion: "1"
kind: sandbox
name: omp
displayName: OMP
description: The omp coding agent (oh-my-pi) — runs inside a Docker sbx sandbox.

sandbox:
  image: "omp-sbx:latest"
  aiFilename: AGENTS.md
  entrypoint:
    run: [omp-init.sh]
commands:
  startup:
    - command:
        - "bash"
        - "-c"
        - |
          # Symlink host ~/.omp mount to /home/agent/.omp
          OMP_HOST=$(find /Users -maxdepth 2 -name .omp -type d 2>/dev/null | head -1)
          [ -n "$OMP_HOST" ] && ln -sf "$OMP_HOST" "$HOME/.omp" || true
          # Symlink host ~/.config/gh mount to /home/agent/.config/gh (gh CLI session)
          GH_HOST=$(mount | grep 'type virtiofs' | grep '/.config/gh ' | sed 's/.* on //; s/ type.*//' | head -1)
          if [ -n "$GH_HOST" ] && [ "$GH_HOST" != "$HOME/.config/gh" ]; then
            mkdir -p "$HOME/.config"
            rm -rf "$HOME/.config/gh"
            ln -sf "$GH_HOST" "$HOME/.config/gh"
          fi
          # Configure git to use gh as a credential helper (enables `git push`
          # over HTTPS by leveraging the gh OAuth token from the mounted session).
          # setup-git just writes git config — it doesn't validate the token,
          # so we only check that hosts.yml is present (auth status would also
          # require network to github.com, which may not be reachable yet).
          if [ -f "$HOME/.config/gh/hosts.yml" ]; then
            gh auth setup-git 2>/dev/null || true
          fi
          # Symlink primary workspace mount to /home/agent/workspace
          # sbx mounts workspaces at their host path; we need them at the
          # template's WORKDIR (/home/agent/workspace) for omp to find them.
          WS_HOST=$(mount | grep 'type virtiofs' | grep -v '\.omp' | grep -v resolv | sed 's/.* on //; s/ type.*//' | head -1)
          if [ -n "$WS_HOST" ] && [ "$WS_HOST" != "/home/agent/workspace" ]; then
            rm -rf /home/agent/workspace
            ln -sf "$WS_HOST" /home/agent/workspace
          fi
          # ── Morph plugin setup (if installed in the image) ─────────────
          # Links pi-morphllm-plugin into ~/.omp/plugins (persists via host
          # mount), creates morph config from the image template, and injects
          # an API key into morph.env.
          #
          # 0.2.0 config path: ~/.pi/morph/morph.json (was ~/.pi/agent/).
          # omp-init.sh symlinks ~/.omp/morph/{morph.json,morph.env} into
          # ~/.pi/morph/ synchronously before omp starts.
          #
          # Key selection (first match wins):
          #   1. MORPH_API_KEY env var → native Morph endpoint (all tools work)
          #   2. Persisted sk-* key already in morph.env (pre-seeded by omp-sbx)
          #   3. OpenRouter key from omp auth store → FastApply only
          MORPH_PKG="$(npm root -g 2>/dev/null)/pi-morphllm-plugin"
          if [ -d "$MORPH_PKG" ]; then
            # Link the plugin if not already registered in the lockfile
            if ! grep -q pi-morphllm-plugin "$HOME/.omp/plugins/omp-plugins.lock.json" 2>/dev/null; then
              omp plugin link "$MORPH_PKG" 2>/dev/null || true
            fi
            # Morph config persists in ~/.omp/morph (host-mounted). omp-init.sh
            # symlinks it to ~/.pi/morph/ before omp starts.
            MORPH_CFG_DIR="$HOME/.omp/morph"
            mkdir -p "$MORPH_CFG_DIR" "$HOME/.pi/morph"
            [ -f "$MORPH_CFG_DIR/morph.json" ] || cp /opt/morph-config/morph.json "$MORPH_CFG_DIR/morph.json"
            # Inject API key (first match wins):
            #   1. MORPH_API_KEY env var (guard against unresolved ${MORPH_API_KEY}
            #      literal when the host env var is absent).
            #   2. Persisted sk-* key already in morph.env (pre-seeded by omp-sbx).
            #   3. OpenRouter key from omp auth store → FastApply only.
            MORPH_KEY=""
            case "${MORPH_API_KEY:-}" in
              '${'*|"") : ;;
              *) MORPH_KEY="$MORPH_API_KEY" ;;
            esac
            if [ -n "$MORPH_KEY" ]; then
              # Native Morph key from env → all tools (FastApply, WarpGrep, compaction)
              printf '%s\n' "$MORPH_KEY" > "$MORPH_CFG_DIR/morph.env"
              chmod 600 "$MORPH_CFG_DIR/morph.env"
              sed -i 's|"baseUrl": "[^"]*"|"baseUrl": "https://api.morphllm.com"|' "$MORPH_CFG_DIR/morph.json"
            else
              # Check for a persisted Morph key (pre-seeded by omp-sbx on the host).
              PERSISTED_KEY="$(head -1 "$MORPH_CFG_DIR/morph.env" 2>/dev/null | tr -d '[:space:]')"
              case "$PERSISTED_KEY" in
                sk-*)
                  # Valid persisted Morph key — preserve it, ensure correct endpoint.
                  sed -i 's|"baseUrl": "[^"]*"|"baseUrl": "https://api.morphllm.com"|' "$MORPH_CFG_DIR/morph.json"
                  ;;
                *)
                  # Fall back to OpenRouter key → FastApply only
                  OR_KEY=$(omp token openrouter 2>/dev/null)
                  if [ -n "$OR_KEY" ]; then
                    printf '%s\n' "$OR_KEY" > "$MORPH_CFG_DIR/morph.env"
                    chmod 600 "$MORPH_CFG_DIR/morph.env"
                    # OpenRouter endpoint (no /v1 — the SDK appends it)
                    sed -i 's|"baseUrl": "[^"]*"|"baseUrl": "https://openrouter.ai/api"|' "$MORPH_CFG_DIR/morph.json"
                  fi
                  ;;
              esac
            fi
          fi
          # If morph was removed from the image but a stale link remains, clean it up
          if [ ! -d "$MORPH_PKG" ] && grep -q pi-morphllm-plugin "$HOME/.omp/plugins/omp-plugins.lock.json" 2>/dev/null; then
            omp plugin uninstall pi-morphllm-plugin 2>/dev/null || true
          fi
      user: "1000"
      description: Symlink host mounts, configure gh credential helper, set up Morph plugin

# ── Network ──────────────────────────────────────────────────────────────────
# omp needs to reach model API providers. The sbx proxy injects API keys from
# the host secret store; inside the sandbox only a placeholder is visible.
network:
  allowedDomains:
    # Model providers — add the ones you use
    - "api.anthropic.com:443"
    - "api.openai.com:443"
    - "openrouter.ai:443"
    - "*.openrouter.ai:443"
    # omp release downloads (native addon self-extraction, updates)
    - "github.com:443"
    - "*.githubusercontent.com:443"
    - "raw.githubusercontent.com:443"
    # Morph API (pi-morphllm-plugin — FastApply, compaction, WarpGrep model calls)
    - "*.morphllm.com:443"
    # Package registries (npm, pip, cargo)
    - "registry.npmjs.org:443"
    - "pypi.org:443"
    - "files.pythonhosted.org:443"
    # Local model servers (host.docker.internal resolves to host)
    - "host.docker.internal:*"
    # AI/doc context
    - "*.context7.com:443"
    - "code.visualstudio.com:443"
    - "*.cloudflare.com:443"
    # Playwright browser downloads (runtime browser install/upgrade)
    - "cdn.playwright.dev:443"
    - "playwright.download.prss.microsoft.com:443"

# ── Environment ──────────────────────────────────────────────────────────────
# PI_CONFIG_DIR=.omp makes omp use ~/.omp (the symlink to the host mount).
environment:
  variables:
    PI_CONFIG_DIR: ".omp"
    HOME: "/home/agent"
    GH_CONFIG_DIR: "/home/agent/.config/gh"
    # agent-browser: Playwright Chromium binary (stable symlink in the image)
    AGENT_BROWSER_EXECUTABLE_PATH: "/usr/local/bin/chromium"
    # sbx injects the proxy CA into the OS trust store at runtime and sets
    # HTTP_PROXY/HTTPS_PROXY — agent-browser picks both up automatically.
    # Do not disable certificate validation; the CA is already trusted.
    AGENT_BROWSER_IGNORE_HTTPS_ERRORS: "false"
    # Native Morph API key (optional — enables the full Morph toolset).
    # omp-sbx sources .env (MORPH_API_KEY=sk-...) before creating the sandbox,
    # so sbx substitutes it here. Without it, falls back to OpenRouter
    # (morph_fastapply only). You can also pass --env to sbx directly.
    MORPH_API_KEY: "${MORPH_API_KEY}"

# ── Agent context (appended to AGENTS.md) ────────────────────────────────────
agentContext: |
  ## Sandbox environment

  You are running inside a Docker sbx sandbox (microVM). The workspace is
  mounted at `/home/agent/workspace`. Your configs (`~/.omp`) are bind-mounted
  from the host — agent.db, managed-skills, memories, and sessions persist
  across sandbox restarts.

  GitHub authentication is forwarded from the host: `gh` CLI commands work
  directly, and `git push` over HTTPS uses the gh credential helper (no
  separate token or SSH setup needed). If `gh auth status` fails, the host's
  `~/.config/gh` is not mounted — recreate the sandbox with `omp-sbx --new`.

  `sudo` is passwordless; use it for system package installs.

  The omp `browser` tool (Puppeteer/Chromium) cannot spawn inside this microVM
  (ENOEXEC on the bundled chrome-linux64 binary). For browser automation use the
  installed `agent-browser` CLI instead (`agent-browser open <url>`, then
  `snapshot`, `click @eN`, `screenshot`, etc.). It uses a real Chromium
  installed via Playwright (`AGENT_BROWSER_EXECUTABLE_PATH=/usr/local/bin/chromium`).
  The sbx TLS proxy intercepts HTTPS. The proxy CA is injected into the
  container trust store at runtime by sbx, so `agent-browser` validates
  certificates normally — no cert-error bypass needed. For fetching static web content
  (articles, docs, JSON, PDFs) prefer the `read` tool on a URL — no browser needed.

  The pi-morphllm-plugin is installed (if built with `INSTALL_MORPH_PLUGIN=1`).
  It adds `morph_fastapply`, `warpgrep_codebase_search`, and
  `warpgrep_github_search` tools plus Morph compaction. The startup script
  prefers a native Morph API key (`MORPH_API_KEY` env var) — all tools work
  with Morph's API. Without one, it falls back to your OpenRouter key
  (morph_fastapply only; WarpGrep and compaction need Morph's API). Run
  `/morph_status` to check the active provider and tool state.
